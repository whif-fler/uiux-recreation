<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing recreation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="schedule-link" href="#contact"><span>Schedule a <strong>Call</strong></span><svg viewBox="0 0 34 12" aria-hidden="true"><path d="M1 6h29M25 1l5 5-5 5"/></svg></a>
  </header>

  <main>
    <section class="hero" aria-labelledby="pricing-title">
      <span class="eyebrow">PRICING</span>
      <h1 id="pricing-title">
        <span class="line">Better tools</span>
        <span class="line line-two">smooth <span class="tool-stack" aria-label="creative tools"><span class="tool tool-dribbble"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="13"/><path d="M10 13c8 5 13 12 15 20M8 22c10-2 19-2 27 2M18 7c2 7 7 12 15 15"/></svg></span><span class="tool tool-be">Bē</span><span class="tool tool-mark"><svg viewBox="0 0 42 34" aria-hidden="true"><path d="M8 24l5-12 5 6 6-11 4 10 5-3 3 10z"/></svg></span></span> <strong>workflow</strong></span>
        <span class="line">including same great deal,</span>
        <span class="line line-four"><span class="toggle-art" aria-hidden="true"><i></i></span> <strong>annually.</strong></span>
      </h1>
    </section>

    <section class="pricing-grid" aria-label="Pricing plans">
      <article class="plan-card">
        <header class="plan-heading">
          <span class="plan-icon"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M11 22l10-10 12 12-10 10z"/><circle cx="17" cy="20" r="1.7"/><path d="M22 17v10M27 21l3 3-3 3"/></svg></span>
          <h2>Free</h2>
          <p class="price"><strong>$0</strong><span>/month</span></p>
        </header>
        <a class="plan-button" href="#contact">Get <strong>Started</strong></a>
        <ul class="features">
          <li>Nothing but a Hug</li>
        </ul>
      </article>

      <article class="plan-card">
        <header class="plan-heading">
          <span class="plan-icon"><svg viewBox="0 0 44 44" aria-hidden="true"><path d="M24 8L14 24h8l-2 12 11-18h-8z"/></svg></span>
          <h2>Personal</h2>
          <p class="price"><strong>$69</strong><span>/month</span></p>
        </header>
        <a class="plan-button" href="#contact">View <strong>Pricing</strong></a>
        <ul class="features">
          <li>Full access to tools, 24/7 support</li>
          <li>Monthly updates</li>
          <li>Customization options</li>
        </ul>
      </article>
    </section>
  </main>

  <footer id="contact" class="visually-hidden">Contact area</footer>
</body>
</html>
