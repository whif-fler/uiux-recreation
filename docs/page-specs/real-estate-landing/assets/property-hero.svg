<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fa8c9"/>
      <stop offset="55%" stop-color="#a9c3d6"/>
      <stop offset="100%" stop-color="#e7d9c3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#sky)"/>
  <!-- distant trees -->
  <rect x="0" y="300" width="800" height="180" fill="#3a4a44" opacity="0.5"/>
  <!-- structure base -->
  <rect x="60" y="230" width="680" height="200" fill="#c9c2b6"/>
  <rect x="60" y="150" width="480" height="90" fill="#2b2e34"/>
  <rect x="420" y="110" width="260" height="60" fill="#1f2226"/>
  <!-- glass facade glow windows -->
  <g>
    <rect x="90" y="170" width="60" height="70" fill="url(#glow)"/>
    <rect x="160" y="170" width="60" height="70" fill="url(#glow)"/>
    <rect x="230" y="170" width="60" height="70" fill="url(#glow)"/>
    <rect x="300" y="170" width="60" height="70" fill="url(#glow)"/>
    <rect x="370" y="170" width="60" height="70" fill="url(#glow)"/>
    <rect x="450" y="140" width="60" height="50" fill="url(#glow)"/>
    <rect x="520" y="140" width="60" height="50" fill="url(#glow)"/>
    <rect x="590" y="140" width="60" height="50" fill="url(#glow)"/>
  </g>
  <!-- balcony line -->
  <rect x="60" y="245" width="480" height="5" fill="#8d8578"/>
  <rect x="60" y="245" width="480" height="60" fill="#e5ded2" opacity="0.4"/>
  <!-- terrace/pool -->
  <rect x="60" y="400" width="680" height="80" fill="#b9c9bd"/>
  <rect x="90" y="415" width="220" height="45" rx="4" fill="#4f8fa8"/>
  <!-- shrubs -->
  <circle cx="620" cy="430" r="22" fill="#33452f"/>
  <circle cx="660" cy="435" r="18" fill="#2c3c28"/>
  <circle cx="700" cy="428" r="24" fill="#33452f"/>
  <!-- lit interior warm glow strip -->
  <rect x="60" y="280" width="480" height="50" fill="#e8b978" opacity="0.55"/>
</svg>
