<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pallet Ross</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#" aria-label="Pallet Ross home">
      <svg class="brand-mark" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 5h12l4 5-7 4L2 11z"/><path d="M17 3h9l1 13-7-5z"/><path d="M10 16l7-4 2 15-6-2z"/></svg>
      <span>Pallet Ross</span>
    </a>
    <nav class="primary-nav" aria-label="Primary navigation">
      <a href="#">Get Started</a><a href="#" class="strategy"><span class="strategy-icon">◉</span>Create strategy</a><a href="#">Pricing</a><a href="#">Contact</a><a href="#">Solution</a><a href="#">E-Commerce</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button" aria-label="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg></button>
      <button class="theme-button" aria-label="Theme"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4.2 4.2l2.1 2.1m11.4 11.4 2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1"/></svg></button>
    </div>
  </header>

  <main class="hero">
    <h1>A place to display your<br>masterpiece.</h1>
    <div class="art-stage" aria-label="A row of seven colorful art cards">
      <div class="handle handle-left">@coplin<span></span></div>
      <div class="handle handle-right">@andrea<span></span></div>
      <figure class="art-card card-1"><img src="assets/art-1.svg" alt="Collage artwork"></figure>
      <figure class="art-card card-2"><img src="assets/art-2.svg" alt="Blue line artwork"></figure>
      <figure class="art-card card-3"><img src="assets/art-3.svg" alt="Yellow poster artwork"></figure>
      <figure class="art-card card-4"><img src="assets/art-4.svg" alt="Abstract gradient artwork"></figure>
      <figure class="art-card card-5"><img src="assets/art-5.svg" alt="Portrait study artwork"></figure>
      <figure class="art-card card-6"><img src="assets/art-6.svg" alt="Graphic number artwork"></figure>
      <figure class="art-card card-7"><img src="assets/art-7.svg" alt="Green poster artwork"></figure>
    </div>
    <p class="hero-copy">Artists can display their masterpieces, and buyers can discover and<br>purchase works that resonate with them.</p>
    <div class="hero-actions"><a class="join-button" href="#">Join for $9.99/m</a><a class="read-more" href="#">Read more</a></div>
  </main>
</body>
</html>
